spring.application.name=motiva-api-test

# ===================================================================
# Configuracao para Testes Integrados Automatizados (H2 em memoria)
# Executa rapido, isolado e sem depender de conexao externa
# ===================================================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria o esquema em memoria automaticamente para os testes
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
