spring.application.name=motiva-api
server.port=8080

# ===================================================================
# Configuracoes de Conexao ao Oracle FIAP
# Pode ser configurado via variaveis de ambiente ou config.local.bat
# ===================================================================
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${ORACLE_USER:rm565994}
spring.datasource.password=${ORACLE_PASSWORD:COLOQUE_SUA_SENHA_AQUI}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de Conexoes HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# Configuracoes JPA / Hibernate (reaproveitando tabelas existentes)
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
